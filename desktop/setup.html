<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>MuseOne Pharma setup</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f6f5f1; color: #1c1f1d; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      form { width: 26rem; background: #fdfcf9; border: 1px solid #dcdad2; border-radius: 6px; padding: 1.5rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .25rem; } p { color: #5d645f; margin: 0 0 1rem; }
      input { width: 100%; box-sizing: border-box; padding: .6rem .75rem; border: 1px solid #dcdad2; border-radius: 6px; font-size: 1rem; }
      button { margin-top: 1rem; width: 100%; padding: .7rem; border: 0; border-radius: 6px; background: #0f5e4b; color: #f6f5f1; font-size: 1rem; }
      #error { color: #a8321f; min-height: 1.2rem; margin-top: .5rem; }
    </style>
  </head>
  <body>
    <form id="f">
      <h1>MuseOne Pharma</h1>
      <p>Enter your pharmacy's billing link. You'll find it in your welcome message.</p>
      <label for="url">Billing link</label>
      <input id="url" placeholder="https://museonepharma.com/t/your-pharmacy" required autofocus />
      <div id="error" role="alert"></div>
      <button>Open billing</button>
    </form>
    <script src="setup.js"></script>
  </body>
</html>
